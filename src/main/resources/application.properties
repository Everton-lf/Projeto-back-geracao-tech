quarkus.datasource.db-kind=mysql
quarkus.datasource.username=root
quarkus.datasource.password=admin
quarkus.datasource.jdbc.url=jdbc:mysql://127.0.0.1:3308/projetofinal?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
quarkus.hibernate-orm.log.sql=true

# Flyway: cria o schema e aplica V1 e V2 automaticamente ao iniciar
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.repair-at-start=true

# Hibernate apenas valida se as entidades batem com as tabelas criadas pelo Flyway
quarkus.hibernate-orm.database.generation=validate

# Autenticação JWT e login
mp.jwt.verify.publickey.location=jwt/publicKey.pem
smallrye.jwt.sign.key.location=jwt/privateKey.pem
mp.jwt.verify.issuer=https://geracao.tech

# Perfil de testes: banco em memória, sem depender do MySQL local.
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:projetofinal;MODE=MySQL;DB_CLOSE_DELAY=-1
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
%test.quarkus.flyway.migrate-at-start=false
%test.quarkus.hibernate-orm.database.generation=drop-and-create

quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui
mp.openapi.extensions.smallrye.info.title=API E-commerce - Projeto Final - Geração Tech
mp.openapi.extensions.smallrye.info.version=1.0.0
mp.openapi.extensions.smallrye.info.description=Documentação oficial da API REST de Usuários, Categorias e Produtos.


